<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#A61C24">
    <title>Fatesck - Login do Professor</title>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" type="image/png" href="../midia/icones/icone-192.png">
    <link rel="apple-touch-icon" href="../midia/icones/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/base.css">
    <script src="../js/tema-inicial.js"></script>
    <script type="module" src="../js/pwa.js"></script>
</head>
<body>
    <main class="entrada">
        <div class="cartao-entrada">
            <img src="../midia/logo.png" alt="Fatesck" class="logo">
            <h1 id="titulo">Login do Professor</h1>
            <p class="mudo" id="subtitulo">Use seu e-mail institucional (termina em cps.sp.gov.br).</p>
            <form id="form-login" novalidate>
                <div class="campo" id="campo-nome" hidden><label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" autocomplete="name" maxlength="80"></div>
                <div class="campo"><label for="email">E-mail institucional</label>
                    <input type="email" id="email" name="email" placeholder="nome@cps.sp.gov.br" autocomplete="username" required></div>
                <div class="campo" id="campo-senha"><label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required></div>
                <div class="aviso-privacidade" id="aviso-privacidade" hidden>
                    <label class="caixa"><input type="checkbox" id="aceite" name="aceite"> <span>Li e concordo com o aviso de privacidade.</span></label>
                </div>
                <p class="erro" id="erro" role="alert"></p>
                <p class="sucesso" id="status" role="status"></p>
                <div class="acoes">
                    <button type="submit" class="botao" id="btn-enviar">Entrar</button>
                    <button type="button" class="link" id="btn-esqueci">Esqueci minha senha</button>
                    <button type="button" class="botao sec" id="btn-alternar">Criar conta</button>
                    <button type="button" class="botao sec" id="btn-voltar">Voltar</button>
                </div>
            </form>
        </div>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
